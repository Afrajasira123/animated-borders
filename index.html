<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=>, initial-scale=1.0" />
    <title>Animated Border CARD</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: rgb(255, 254, 254);
      }
      .card {
        width: 300px;
        height: 400px;
        background: #ebf57a;
        position: relative;
        display: flex;
        place-content: center;
        place-items: center;
        overflow: hidden;
        border-radius: 20px;
      }
      .card h2 {
        z-index: 1;
        color: white;
        font-size: 20px;
      }
      h2:hover {
        background-color: #030303;
        border-radius: 4px;
        color: cyan;
        padding: 2px 6px;
      }
      .card::before {
        content: "";
        position: absolute;
        width: 100px;
        background-image: linear-gradient(180deg, rgb(16, 157, 213), rgb(255, 48, 255));
        height: 130%;
        animation: rotBGimg 3s linear infinite;
        transition: all 0.1s linear;
      }
      @keyframes rotBGimg {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .card::after {
        content: "";
        position: absolute;
        background: #f82685;
        inset: 7px;
        border-radius: 15px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>CARD</h2>
    </div>
  </body>
</html>
